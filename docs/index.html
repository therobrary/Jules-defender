<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON DEFENDER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ffffff;
            --enemy-color: #aaaaaa;
            --grid-color: #222222;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(5px);
            z-index: 10;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: fadeInDown 1s ease-out;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
            color: var(--text-color);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        button {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 30px;
            border-radius: 4px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; /* Hidden until game starts */
        }

        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        #minimap-container {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 40px;
            border: 1px solid var(--grid-color);
            background: rgba(18, 18, 18, 0.9);
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 150px;
            display: none; /* Shown via JS detection */
            pointer-events: auto;
        }

        .d-pad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .d-pad-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .fire-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            <div id="score-display">SCORE: 0</div>
            <div id="lives-display">LIVES: 3</div>
        </div>
        <div id="minimap-container">
            <canvas id="minimapCanvas"></canvas>
        </div>

        <div id="mobile-controls">
            <div class="d-pad" id="dpad">
                <div class="d-pad-center"></div>
            </div>
            <div class="fire-btn" id="fireBtn">FIRE</div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1>NEON DEFENDER</h1>
        <p>ARROWS to Fly | SPACE to Fire</p>
        <p>Touch: Left stick to Fly | Right button to Fire</p>
        <button id="start-btn">INITIATE SYSTEM</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: #ff5555;">MISSION FAILED</h1>
        <p id="final-score">SCORE: 0</p>
        <button id="restart-btn">REBOOT</button>
    </div>
</div>

<script>
/**
 * NEON DEFENDER
 * A single-file clone of Defender mechanics.
 */

// --- CONFIGURATION ---
const CONFIG = {
    WORLD_WIDTH: 4000, // Width of the game world (pixels)
    STAR_COUNT: 150,
    PLAYER_SPEED: 0.5, // Acceleration
    PLAYER_MAX_SPEED: 10,
    PLAYER_FRICTION: 0.96,
    LASER_SPEED: 15,
    ENEMY_SPEED: 2,
    SPAWN_RATE: 100, // Frames between spawns
    COLORS: {
        bg: '#121212',
        player: '#ffffff',
        enemy: '#aaaaaa',
        laser: '#e0e0e0',
        particle: '#dddddd',
        minimap_player: '#ffffff',
        minimap_enemy: '#ff5555',
        grid: '#222222'
    }
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    init: function() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
    },
    playTone: function(freq, type, duration, vol = 0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    shoot: function() {
        // Laser sound: slide frequency down
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    },
    explode: function() {
        // Noise buffer for explosion
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.5; // 0.5 seconds
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        noise.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
    }
};

// --- INPUT SYSTEM ---
const Input = {
    keys: {},
    touch: { active: false, dx: 0, dy: 0, fire: false },
    init: function() {
        window.addEventListener('keydown', e => this.keys[e.code] = true);
        window.addEventListener('keyup', e => this.keys[e.code] = false);

        // Mobile Controls
        const dpad = document.getElementById('dpad');
        const fireBtn = document.getElementById('fireBtn');

        // Check for touch device roughly
        if ('ontouchstart' in window || navigator.maxTouchPoints) {
             document.getElementById('mobile-controls').style.display = 'block';
        }

        // D-Pad Logic
        dpad.addEventListener('touchstart', e => this.handleDpad(e), {passive: false});
        dpad.addEventListener('touchmove', e => this.handleDpad(e), {passive: false});
        dpad.addEventListener('touchend', e => {
            e.preventDefault();
            this.touch.active = false;
            this.touch.dx = 0;
            this.touch.dy = 0;
        });

        // Fire Logic
        fireBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            this.touch.fire = true;
        }, {passive: false});
        fireBtn.addEventListener('touchend', e => {
            e.preventDefault();
            this.touch.fire = false;
        });
    },
    handleDpad: function(e) {
        e.preventDefault();
        const touch = e.targetTouches[0];
        const rect = e.target.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = touch.clientX - centerX;
        const dy = touch.clientY - centerY;

        // Normalize
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = rect.width / 2;

        this.touch.active = true;
        // Reduced sensitivity: divisor is maxDist * 1.0 instead of 0.5
        this.touch.dx = Math.max(-1, Math.min(1, dx / (maxDist * 1.0)));
        this.touch.dy = Math.max(-1, Math.min(1, dy / (maxDist * 1.0)));
    }
};

// --- GAME ENGINE ---
const Game = {
    canvas: null,
    ctx: null,
    minimapCanvas: null,
    minimapCtx: null,
    width: 0,
    height: 0,
    lastTime: 0,
    running: false,

    cameraX: 0,

    entities: [],
    particles: [],
    stars: [],

    score: 0,
    lives: 3,
    wave: 1,

    init: function() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.minimapCanvas = document.getElementById('minimapCanvas');
        this.minimapCtx = this.minimapCanvas.getContext('2d');

        this.resize();
        window.addEventListener('resize', () => this.resize());

        Input.init();

        document.getElementById('start-btn').addEventListener('click', () => this.start());
        document.getElementById('restart-btn').addEventListener('click', () => this.start());
    },

    resize: function() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        // Minimap resize
        const mmContainer = document.getElementById('minimap-container');
        this.minimapCanvas.width = mmContainer.clientWidth;
        this.minimapCanvas.height = mmContainer.clientHeight;
    },

    start: function() {
        AudioSys.init();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('ui-layer').style.display = 'block';

        this.resetGame();
        this.running = true;
        this.lastTime = performance.now();
        requestAnimationFrame(t => this.loop(t));
    },

    resetGame: function() {
        this.entities = [];
        this.particles = [];
        this.score = 0;
        this.lives = 3;
        this.wave = 1;
        this.cameraX = 0;

        this.player = new Player(CONFIG.WORLD_WIDTH / 2, this.height / 2);
        this.entities.push(this.player);

        // Generate Stars (Optional for new aesthetic, but kept for motion)
        this.stars = [];
        for(let i=0; i<CONFIG.STAR_COUNT; i++) {
            this.stars.push({
                x: Math.random() * CONFIG.WORLD_WIDTH,
                y: Math.random() * this.height,
                size: Math.random() * 1.5,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        this.spawnWave();
        this.updateHUD();
    },

    spawnWave: function() {
        const count = 5 + (this.wave * 2);
        for(let i=0; i<count; i++) {
            // Spawn away from player
            let x = Math.random() * CONFIG.WORLD_WIDTH;
            if (Math.abs(x - this.player.x) < 500) x = (x + 1000) % CONFIG.WORLD_WIDTH;

            this.entities.push(new Lander(x, Math.random() * (this.height - 100) + 50));
        }
    },

    gameOver: function() {
        this.running = false;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('ui-layer').style.display = 'none';
        document.getElementById('final-score').textContent = "SCORE: " + this.score;
    },

    loop: function(now) {
        if (!this.running) return;
        const dt = (now - this.lastTime) / 1000;
        this.lastTime = now;

        this.update(dt);
        this.draw();

        requestAnimationFrame(t => this.loop(t));
    },

    update: function(dt) {
        // Spawn logic check
        const enemies = this.entities.filter(e => e.type === 'enemy');
        if (enemies.length === 0) {
            this.wave++;
            this.spawnWave();
        }

        // Update Entities
        this.entities.forEach(e => e.update(dt));
        this.particles.forEach(p => p.update(dt));

        // Remove dead
        this.entities = this.entities.filter(e => !e.dead);
        this.particles = this.particles.filter(p => p.life > 0);

        // Camera Follow Player
        // Center player on screen
        let targetCamX = this.player.x - this.width / 2;

        // Smooth camera? Or locked? Defender is usually locked but lets do slight smoothing
        // Actually, for wrapping, direct lock is easier to calculate
        this.cameraX = targetCamX;

        // World Wrap Camera coords logic is tricky visually,
        // but we just render based on offset.
        // We normalize cameraX to 0..WORLD_WIDTH for some calcs, but strictly we just use it as offset.

        // Collisions
        this.checkCollisions();

        // Input Fire (Debounce handled in Player)
        if ((Input.keys['Space'] || Input.touch.fire) && this.player.canFire()) {
            this.player.fire();
        }
    },

    checkCollisions: function() {
        const bullets = this.entities.filter(e => e.type === 'bullet');
        const enemies = this.entities.filter(e => e.type === 'enemy');
        const player = this.player;

        // Bullet vs Enemy
        for (let b of bullets) {
            if (b.owner === 'player') {
                for (let e of enemies) {
                    if (this.checkRectOverlap(b, e)) {
                        b.dead = true;
                        e.takeDamage();
                    }
                }
            }
        }

        // Player vs Enemy
        if (!player.dead && !player.invulnerable) {
            for (let e of enemies) {
                if (this.checkRectOverlap(player, e)) {
                    player.die();
                    e.takeDamage(); // ramming kills enemy too?
                }
            }
        }
    },

    checkRectOverlap: function(a, b) {
        // Simple AABB, but handle world wrapping?
        // Since we move entities, local coords should be close.
        // If entities are far apart due to wrapping, this check fails, which is correct.
        // Wait, visually they might overlap if one is wrapped.
        // We should check normal, +World, -World relative positions.
        // For simplicity in this clone, we rely on the fact that entities are moved
        // into 0..WORLD_WIDTH range every frame.
        // So we just check |dx| < width.

        let dx = Math.abs(a.x - b.x);
        let dy = Math.abs(a.y - b.y);

        if (dx > CONFIG.WORLD_WIDTH / 2) dx = CONFIG.WORLD_WIDTH - dx; // wrapped distance

        return (dx < (a.w/2 + b.w/2) && dy < (a.h/2 + b.h/2));
    },

    draw: function() {
        // Clear background
        this.ctx.fillStyle = CONFIG.COLORS.bg;
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.save();

        // Draw Grid Background (parallax?)
        // Let's make a static grid relative to world
        const GRID_SIZE = 50;
        this.ctx.strokeStyle = CONFIG.COLORS.grid;
        this.ctx.lineWidth = 1;

        // Calculate offset based on camera
        // We want grid lines to move with the world
        let startX = Math.floor(this.cameraX / GRID_SIZE) * GRID_SIZE;

        // Vertical lines
        for (let x = startX; x < startX + this.width + GRID_SIZE; x += GRID_SIZE) {
             let drawX = x - this.cameraX;
             this.ctx.beginPath();
             this.ctx.moveTo(drawX, 0);
             this.ctx.lineTo(drawX, this.height);
             this.ctx.stroke();
        }
        // Horizontal lines
        for (let y = 0; y < this.height; y += GRID_SIZE) {
             this.ctx.beginPath();
             this.ctx.moveTo(0, y);
             this.ctx.lineTo(this.width, y);
             this.ctx.stroke();
        }


        // Draw Stars (Subtle in background)
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        this.stars.forEach(s => {
            // Parallax x relative to camera
            let x = s.x - this.cameraX * 0.5;
            // Wrap star x
            x = ((x % CONFIG.WORLD_WIDTH) + CONFIG.WORLD_WIDTH) % CONFIG.WORLD_WIDTH;

            this.ctx.fillRect(x, s.y, s.size, s.size);
        });

        // Draw Terrain Line
        this.ctx.strokeStyle = '#333';
        this.ctx.lineWidth = 2;
        this.ctx.shadowBlur = 0;
        this.ctx.beginPath();
        // Simple line at bottom
        let groundY = this.height - 20;
        this.ctx.moveTo(0, groundY);
        this.ctx.lineTo(this.width, groundY);
        this.ctx.stroke();

        // Draw Entities
        this.entities.forEach(e => {
            // Draw relative to camera
            let rx = e.x - this.cameraX;
            // Wrap rx to be near screen
            let drawnX = rx;
            while (drawnX < -100) drawnX += CONFIG.WORLD_WIDTH;
            while (drawnX > this.width + 100) drawnX -= CONFIG.WORLD_WIDTH;

            this.ctx.save();
            this.ctx.translate(drawnX, e.y);
            e.draw(this.ctx);
            this.ctx.restore();
        });

        // Draw Particles
        this.particles.forEach(p => {
            let rx = p.x - this.cameraX;
            while (rx < -100) rx += CONFIG.WORLD_WIDTH;
            while (rx > this.width + 100) rx -= CONFIG.WORLD_WIDTH;

            this.ctx.save();
            this.ctx.translate(rx, p.y);
            p.draw(this.ctx);
            this.ctx.restore();
        });

        this.ctx.restore();

        // Draw Minimap
        this.drawMinimap();
    },

    drawMinimap: function() {
        const mmW = this.minimapCanvas.width;
        const mmH = this.minimapCanvas.height;
        const scaleX = mmW / CONFIG.WORLD_WIDTH;
        const scaleY = mmH / this.height;

        this.minimapCtx.clearRect(0, 0, mmW, mmH);
        this.minimapCtx.fillStyle = '#000'; // Minimap bg
        this.minimapCtx.fillRect(0, 0, mmW, mmH);

        // Draw Frame (current view)
        // CameraX corresponds to left edge
        let camX = ((this.cameraX % CONFIG.WORLD_WIDTH) + CONFIG.WORLD_WIDTH) % CONFIG.WORLD_WIDTH;
        let camW = this.width;

        this.minimapCtx.strokeStyle = '#555';
        this.minimapCtx.strokeRect(camX * scaleX, 0, camW * scaleX, mmH);
        // Handle wrap for frame
        if (camX + camW > CONFIG.WORLD_WIDTH) {
             this.minimapCtx.strokeRect((camX - CONFIG.WORLD_WIDTH) * scaleX, 0, camW * scaleX, mmH);
        }

        this.entities.forEach(e => {
            let mx = e.x * scaleX;
            let my = e.y * scaleY;

            if (e.type === 'player') this.minimapCtx.fillStyle = CONFIG.COLORS.minimap_player;
            else if (e.type === 'enemy') this.minimapCtx.fillStyle = CONFIG.COLORS.minimap_enemy;
            else return;

            this.minimapCtx.fillRect(mx, my, 2, 2);
        });
    },

    updateHUD: function() {
        document.getElementById('score-display').innerText = `SCORE: ${this.score}`;
        document.getElementById('lives-display').innerText = `LIVES: ${this.lives}`;
    },

    spawnExplosion: function(x, y, color) {
        AudioSys.explode();
        for(let i=0; i<10; i++) {
            this.particles.push(new Particle(x, y, color));
        }
    }
};

// --- ENTITIES ---

class Entity {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.w = 0;
        this.h = 0;
        this.dead = false;
        this.type = 'entity';
    }

    update(dt) {
        this.x += this.vx; // * dt handled by pre-scaling v or simple per-frame logic?
        // Let's assume vx is pixels per frame for simplicity or stick to dt.
        // If vx is pixels/sec, multiply by dt.
        // The CONFIG speeds are small (0.5), implying per-frame acceleration?
        // Let's use per-frame physics for that classic feel, or normalize.
        // Let's assume 60fps: dt ~ 0.016.
        // If speed is 10 pixels/frame -> 600 pixels/sec.

        // Let's adhere to dt for smooth 60fps+.
        // Adjust config values.

        this.y += this.vy;

        // Wrap World
        if (this.x < 0) this.x += CONFIG.WORLD_WIDTH;
        if (this.x > CONFIG.WORLD_WIDTH) this.x -= CONFIG.WORLD_WIDTH;
    }

    draw(ctx) {}
}

class Player extends Entity {
    constructor(x, y) {
        super(x, y);
        this.type = 'player';
        this.w = 30;
        this.h = 15;
        this.facingRight = true;
        this.lastFireTime = 0;
        this.invulnerable = false;
    }

    update(dt) {
        // Input Handling
        // We need to scale acceleration by dt to be framerate independent
        // dt is in seconds.
        // Let's say Acceleration is 600 px/s^2.
        const ACCEL = 600 * dt;
        const MAX_SPEED = 10; // px per frame? 10 * 60 = 600 px/s.
        const FRICTION = Math.pow(CONFIG.PLAYER_FRICTION, dt * 60); // Adjust friction for dt

        let inputX = 0;
        let inputY = 0;

        if (Input.keys['ArrowUp'] || Input.touch.dy < -0.2) inputY = -1;
        if (Input.keys['ArrowDown'] || Input.touch.dy > 0.2) inputY = 1;
        if (Input.keys['ArrowLeft'] || Input.touch.dx < -0.2) inputX = -1;
        if (Input.keys['ArrowRight'] || Input.touch.dx > 0.2) inputX = 1;

        if (inputX !== 0) {
            this.vx += inputX * ACCEL;
            this.facingRight = inputX > 0;
        }
        if (inputY !== 0) {
            this.vy += inputY * ACCEL;
        }

        // Friction
        this.vx *= FRICTION;
        this.vy *= FRICTION;

        // Bounds Y
        if (this.y < 50) this.y = 50;
        if (this.y > Game.height - 50) this.y = Game.height - 50;

        super.update(dt);
    }

    draw(ctx) {
        if (this.invulnerable && Math.floor(Date.now() / 100) % 2 === 0) return; // Blink

        ctx.strokeStyle = CONFIG.COLORS.player;
        ctx.fillStyle = '#fff';
        ctx.lineWidth = 2;
        // Stronger white glow
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 20;

        ctx.beginPath();
        if (this.facingRight) {
            ctx.moveTo(-15, -7);
            ctx.lineTo(15, 0);
            ctx.lineTo(-15, 7);
            ctx.lineTo(-10, 0);
            ctx.closePath();
        } else {
            ctx.moveTo(15, -7);
            ctx.lineTo(-15, 0);
            ctx.lineTo(15, 7);
            ctx.lineTo(10, 0);
            ctx.closePath();
        }
        ctx.stroke();

        // Engine flame (simple line, less "fire")
        ctx.beginPath();
        ctx.strokeStyle = '#ccc';
        if (this.facingRight && Math.random() > 0.5) {
            ctx.moveTo(-15, 0);
            ctx.lineTo(-25, 0);
        } else if (!this.facingRight && Math.random() > 0.5) {
            ctx.moveTo(15, 0);
            ctx.lineTo(25, 0);
        }
        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    canFire() {
        const now = performance.now();
        if (now - this.lastFireTime > 200) { // 200ms fire rate
            return true;
        }
        return false;
    }

    fire() {
        this.lastFireTime = performance.now();
        AudioSys.shoot();

        const dir = this.facingRight ? 1 : -1;
        // Bullet spawns in front
        const bx = this.x + (dir * 20);
        // Bullet velocity adds player velocity? Or constant?
        // Usually constant high speed + player velocity fraction.
        const bvx = (dir * CONFIG.LASER_SPEED) + (this.vx * 0.5);

        Game.entities.push(new Bullet(bx, this.y, bvx, 'player'));
    }

    die() {
        Game.spawnExplosion(this.x, this.y, CONFIG.COLORS.player);
        Game.lives--;
        Game.updateHUD();
        if (Game.lives <= 0) {
            Game.gameOver();
        } else {
            // Respawn center screen relative to camera
            this.x = Game.cameraX + Game.width / 2;
            this.y = Game.height / 2;
            this.vx = 0;
            this.vy = 0;
            this.invulnerable = true;
            setTimeout(() => { this.invulnerable = false; }, 2000);
        }
    }
}

class Lander extends Entity {
    constructor(x, y) {
        super(x, y);
        this.type = 'enemy';
        this.w = 20;
        this.h = 20;
        this.timer = Math.random() * 100;
        this.vx = (Math.random() - 0.5) * 2; // Drift
    }

    update(dt) {
        this.timer += dt * 10;
        // Bobbing motion
        this.vy = Math.sin(this.timer) * 1;

        // Drift towards player slowly?
        // Or just patrol.
        super.update(dt);
    }

    draw(ctx) {
        ctx.strokeStyle = CONFIG.COLORS.enemy;
        ctx.lineWidth = 2;
        // Stronger grey glow
        ctx.shadowColor = CONFIG.COLORS.enemy;
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.moveTo(-10, -10);
        ctx.lineTo(10, -10);
        ctx.lineTo(10, 5);
        ctx.lineTo(0, 10);
        ctx.lineTo(-10, 5);
        ctx.closePath();

        // Inner detail
        ctx.moveTo(-5, -5);
        ctx.lineTo(5, -5);
        ctx.lineTo(0, 5);
        ctx.closePath();

        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    takeDamage() {
        this.dead = true;
        Game.score += 100;
        Game.updateHUD();
        Game.spawnExplosion(this.x, this.y, CONFIG.COLORS.enemy);
    }
}

class Bullet extends Entity {
    constructor(x, y, vx, owner) {
        super(x, y);
        this.type = 'bullet';
        this.vx = vx;
        this.vy = 0;
        this.w = 20;
        this.h = 5;
        this.owner = owner; // 'player' or 'enemy'
        this.life = 2.0; // Seconds
    }

    update(dt) {
        this.life -= dt;
        if (this.life <= 0) this.dead = true;

        this.x += this.vx * (dt * 60);

        if (this.x < 0) this.x += CONFIG.WORLD_WIDTH;
        if (this.x > CONFIG.WORLD_WIDTH) this.x -= CONFIG.WORLD_WIDTH;
    }

    draw(ctx) {
        ctx.fillStyle = CONFIG.COLORS.laser;
        // Stronger laser glow
        ctx.shadowColor = CONFIG.COLORS.laser;
        ctx.shadowBlur = 15;
        ctx.fillRect(-10, -2, 20, 4);
        ctx.shadowBlur = 0;
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.05 + 0.02;
    }

    update(dt) {
        this.x += this.vx * (dt * 60);
        this.y += this.vy * (dt * 60);
        this.life -= this.decay;
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillRect(-2, -2, 4, 4);
        ctx.globalAlpha = 1.0;
    }
}

// Start
Game.init();

</script>
