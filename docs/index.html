<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robrary Games: Defender</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #ffffff;
            --enemy-color: #aaaaaa;
            --grid-color: #222222;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(5px);
            z-index: 10;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: fadeInDown 1s ease-out;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
            color: var(--text-color);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        button {
            background: transparent;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 30px;
            border-radius: 4px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none; /* Hidden until game starts */
        }

        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        #minimap-container {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 40px;
            border: 1px solid var(--grid-color);
            background: rgba(18, 18, 18, 0.9);
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 250px;
            display: none; /* Shown via JS detection */
            pointer-events: auto;
        }

        .d-pad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .d-pad-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        .fire-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .action-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }
        #bomb-btn {
            bottom: 150px;
            right: 40px;
            border-color: #ff5555;
            color: #ff5555;
        }
        #warp-btn {
            bottom: 40px;
            right: 150px;
            border-color: #00ffff;
            color: #00ffff;
        }

        .hidden {
            display: none !important;
        }

    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="hud">
            <div id="score-display">SCORE: 0</div>
            <div id="lives-display">LIVES: 3 | BOMBS: 3</div>
        </div>
        <div id="minimap-container">
            <canvas id="minimapCanvas"></canvas>
        </div>

        <div id="mobile-controls">
            <div class="d-pad" id="dpad">
                <div class="d-pad-center"></div>
            </div>
            <div class="fire-btn" id="fireBtn">FIRE</div>
            <div class="action-btn" id="bomb-btn">BOMB</div>
            <div class="action-btn" id="warp-btn">WARP</div>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1>Robrary Games: Defender</h1>
        <p>ARROWS to Fly | SPACE to Fire</p>
        <p>B to Bomb | H to Warp</p>
        <p>Touch: Left stick to Fly | Right buttons to Act</p>
        <button id="start-btn">INITIATE SYSTEM</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: #ff5555; text-shadow: 0 0 10px rgba(255, 85, 85, 0.5);">MISSION FAILED</h1>
        <p id="final-score">SCORE: 0</p>
        <button id="restart-btn">REBOOT</button>
    </div>

    <div id="pause-screen" class="overlay hidden">
        <h1>PAUSED</h1>
        <button id="resume-btn">RESUME</button>
        <button id="quit-btn">QUIT</button>
    </div>
</div>

<script>
/**
 * NEON DEFENDER
 * A single-file clone of Defender mechanics.
 */

// --- CONFIGURATION ---
const CONFIG = {
    WORLD_WIDTH: 4000, // Width of the game world (pixels)
    STAR_COUNT: 150,
    PLAYER_ACCEL_X: 500, // Horizontal Acceleration
    PLAYER_ACCEL_Y: 250, // Vertical Acceleration (Reduced sensitivity)
    PLAYER_MAX_SPEED_X: 9,
    PLAYER_MAX_SPEED_Y: 4, // Reduced vertical max speed
    PLAYER_FRICTION: 0.96,
    LASER_SPEED: 15,
    ENEMY_SPEED: 2,
    SPAWN_RATE: 100, // Frames between spawns
    POWERUP_CHANCE: 0.2, // 20% chance
    COLORS: {
        bg: '#121212',
        player: '#ffffff',
        enemy: '#aaaaaa',
        laser: '#e0e0e0',
        particle: '#dddddd',
        minimap_player: '#ffffff',
        minimap_enemy: '#ff5555',
        grid: '#222222',
        shield: '#00ffff',
        rapid: '#ffff00',
        speed: '#00ff00'
    }
};

const POWERUPS = {
    SHIELD: 'SHIELD',
    RAPID: 'RAPID',
    SPEED: 'SPEED'
};

// --- AUDIO SYSTEM ---
const AudioSys = {
    ctx: null,
    init: function() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
    },
    playTone: function(freq, type, duration, vol = 0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    shoot: function() {
        // Laser sound: slide frequency down
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    },
    explode: function() {
        // Noise buffer for explosion
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 0.5; // 0.5 seconds
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        noise.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
    }
};

// --- INPUT SYSTEM ---
const Input = {
    keys: {},
    touch: { active: false, dx: 0, dy: 0, fire: false },
    init: function() {
        window.addEventListener('keydown', e => {
            this.keys[e.code] = true;
            if (e.code === 'Escape') Game.togglePause();
            // Feature Inputs
            if (e.key === 'b' || e.key === 'B') Game.triggerSmartBomb();
            if (e.key === 'h' || e.key === 'H') Game.player && Game.player.hyperspace();
        });
        window.addEventListener('keyup', e => this.keys[e.code] = false);

        // Mobile Controls
        const dpad = document.getElementById('dpad');
        const fireBtn = document.getElementById('fireBtn');
        const bombBtn = document.getElementById('bomb-btn');
        const warpBtn = document.getElementById('warp-btn');

        // Check for touch device roughly
        if ('ontouchstart' in window || navigator.maxTouchPoints) {
             document.getElementById('mobile-controls').style.display = 'block';
        }

        // D-Pad Logic
        dpad.addEventListener('touchstart', e => this.handleDpad(e), {passive: false});
        dpad.addEventListener('touchmove', e => this.handleDpad(e), {passive: false});
        dpad.addEventListener('touchend', e => {
            e.preventDefault();
            this.touch.active = false;
            this.touch.dx = 0;
            this.touch.dy = 0;
        });

        // Fire Logic
        fireBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            this.touch.fire = true;
        }, {passive: false});
        fireBtn.addEventListener('touchend', e => {
            e.preventDefault();
            this.touch.fire = false;
        });

        // Bomb Logic (Touch)
        bombBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            Game.triggerSmartBomb();
        }, {passive: false});

        // Warp Logic (Touch)
        warpBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            if(Game.player) Game.player.hyperspace();
        }, {passive: false});
    },
    handleDpad: function(e) {
        e.preventDefault();
        const touch = e.targetTouches[0];
        const rect = e.target.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const dx = touch.clientX - centerX;
        const dy = touch.clientY - centerY;

        // Normalize
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxDist = rect.width / 2;

        this.touch.active = true;
        // Reduced sensitivity: divisor is maxDist * 1.0 instead of 0.5
        this.touch.dx = Math.max(-1, Math.min(1, dx / (maxDist * 1.0)));
        this.touch.dy = Math.max(-1, Math.min(1, dy / (maxDist * 1.0)));
    }
};

// --- GAME ENGINE ---
const Game = {
    canvas: null,
    ctx: null,
    minimapCanvas: null,
    minimapCtx: null,
    width: 0,
    height: 0,
    lastTime: 0,
    running: false,
    paused: false,

    cameraX: 0,

    entities: [],
    particles: [],
    stars: [],

    score: 0,
    lives: 3,
    wave: 1,

    init: function() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.minimapCanvas = document.getElementById('minimapCanvas');
        this.minimapCtx = this.minimapCanvas.getContext('2d');

        this.resize();
        window.addEventListener('resize', () => this.resize());

        Input.init();

        document.getElementById('start-btn').addEventListener('click', () => this.start());
        document.getElementById('restart-btn').addEventListener('click', () => this.start());
        document.getElementById('resume-btn').addEventListener('click', () => this.togglePause());
        document.getElementById('quit-btn').addEventListener('click', () => this.quitGame());
    },

    resize: function() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width;
        this.canvas.height = this.height;

        // Minimap resize
        const mmContainer = document.getElementById('minimap-container');
        this.minimapCanvas.width = mmContainer.clientWidth;
        this.minimapCanvas.height = mmContainer.clientHeight;
    },

    start: function() {
        AudioSys.init();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('ui-layer').style.display = 'block';

        this.resetGame();
        this.running = true;
        this.paused = false;
        this.lastTime = performance.now();
        requestAnimationFrame(t => this.loop(t));
    },

    togglePause: function() {
        if (!this.running) return;
        this.paused = !this.paused;
        const pauseScreen = document.getElementById('pause-screen');
        if (this.paused) {
            pauseScreen.classList.remove('hidden');
        } else {
            pauseScreen.classList.add('hidden');
            this.lastTime = performance.now(); // Prevent dt jump
            requestAnimationFrame(t => this.loop(t));
        }
    },

    quitGame: function() {
        this.running = false;
        this.paused = false;
        document.getElementById('pause-screen').classList.add('hidden');
        document.getElementById('ui-layer').style.display = 'none';
        document.getElementById('start-screen').classList.remove('hidden');
    },

    resetGame: function() {
        this.entities = [];
        this.particles = [];
        this.score = 0;
        this.lives = 3;
        this.smartBombs = 3;
        this.wave = 1;
        this.cameraX = 0;

        this.player = new Player(CONFIG.WORLD_WIDTH / 2, this.height / 2);
        this.entities.push(this.player);

        // Stars kept for subtle background motion (rendered at 0.3 opacity)
        this.stars = [];
        for(let i=0; i<CONFIG.STAR_COUNT; i++) {
            this.stars.push({
                x: Math.random() * CONFIG.WORLD_WIDTH,
                y: Math.random() * this.height,
                size: Math.random() * 1.5,
                speed: Math.random() * 0.5 + 0.1
            });
        }

        this.spawnWave();
        this.updateHUD();
    },

    spawnWave: function() {
        const count = 5 + (this.wave * 2);
        for(let i=0; i<count; i++) {
            // Spawn away from player
            let x = Math.random() * CONFIG.WORLD_WIDTH;
            if (Math.abs(x - this.player.x) < 500) x = (x + 1000) % CONFIG.WORLD_WIDTH;

            this.entities.push(new Lander(x, Math.random() * (this.height - 100) + 50));
        }
    },

    gameOver: function() {
        this.running = false;
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('ui-layer').style.display = 'none';
        document.getElementById('final-score').textContent = "SCORE: " + this.score;
    },

    loop: function(now) {
        if (!this.running) return;
        if (this.paused) return; // Stop loop when paused

        const dt = (now - this.lastTime) / 1000;
        this.lastTime = now;

        this.update(dt);
        this.draw();

        requestAnimationFrame(t => this.loop(t));
    },

    update: function(dt) {
        // Spawn logic check
        const enemies = this.entities.filter(e => e.type === 'enemy');
        if (enemies.length === 0) {
            this.wave++;
            this.spawnWave();
        }

        // Update Entities
        this.entities.forEach(e => e.update(dt));
        this.particles.forEach(p => p.update(dt));

        // Remove dead
        this.entities = this.entities.filter(e => !e.dead);
        this.particles = this.particles.filter(p => p.life > 0);

        // Camera Follow Player
        // Center player on screen
        let targetCamX = this.player.x - this.width / 2;

        // Smooth camera? Or locked? Defender is usually locked but lets do slight smoothing
        // Actually, for wrapping, direct lock is easier to calculate
        this.cameraX = targetCamX;

        // World Wrap Camera coords logic is tricky visually,
        // but we just render based on offset.
        // We normalize cameraX to 0..WORLD_WIDTH for some calcs, but strictly we just use it as offset.

        // Collisions
        this.checkCollisions();

        // Check Powerups
        this.checkPowerups();

        // Input Fire (Debounce handled in Player)
        if ((Input.keys['Space'] || Input.touch.fire) && this.player.canFire()) {
            this.player.fire();
        }
    },

    checkCollisions: function() {
        const bullets = this.entities.filter(e => e.type === 'bullet');
        const enemies = this.entities.filter(e => e.type === 'enemy');
        const player = this.player;

        // Bullet vs Enemy / Player
        for (let b of bullets) {
            if (b.owner === 'player') {
                for (let e of enemies) {
                    if (this.checkRectOverlap(b, e)) {
                        b.dead = true;
                        e.takeDamage();
                    }
                }
            } else if (b.owner === 'enemy') {
                if (!player.dead && !player.invulnerable && this.checkRectOverlap(b, player)) {
                    b.dead = true;
                    if (player.shieldActive) {
                        player.deactivateShield();
                    } else {
                        player.die();
                    }
                }
            }
        }

        // Player vs Enemy
        if (!player.dead && !player.invulnerable) {
            for (let e of enemies) {
                if (this.checkRectOverlap(player, e)) {
                    if (player.shieldActive) {
                        player.deactivateShield();
                        e.takeDamage(); // Shield also kills the enemy on contact
                    } else {
                        player.die();
                        e.takeDamage(); // ramming kills enemy too?
                    }
                }
            }
        }
    },

    checkPowerups: function() {
        const powerups = this.entities.filter(e => e.type === 'powerup');
        const player = this.player;

        for (let p of powerups) {
            if (this.checkRectOverlap(player, p)) {
                p.dead = true;
                player.activatePowerup(p.kind);
                AudioSys.playTone(600, 'sine', 0.1);
                AudioSys.playTone(800, 'sine', 0.1, 0.1); // Powerup sound
            }
        }
    },

    checkRectOverlap: function(a, b) {
        // Simple AABB, but handle world wrapping?
        // Since we move entities, local coords should be close.
        // If entities are far apart due to wrapping, this check fails, which is correct.
        // Wait, visually they might overlap if one is wrapped.
        // We should check normal, +World, -World relative positions.
        // For simplicity in this clone, we rely on the fact that entities are moved
        // into 0..WORLD_WIDTH range every frame.
        // So we just check |dx| < width.

        let dx = Math.abs(a.x - b.x);
        let dy = Math.abs(a.y - b.y);

        if (dx > CONFIG.WORLD_WIDTH / 2) dx = CONFIG.WORLD_WIDTH - dx; // wrapped distance

        return (dx < (a.w/2 + b.w/2) && dy < (a.h/2 + b.h/2));
    },

    draw: function() {
        // Clear background
        this.ctx.fillStyle = CONFIG.COLORS.bg;
        this.ctx.fillRect(0, 0, this.width, this.height);

        this.ctx.save();

        // Draw Grid Background (moves with world camera)
        // Let's make a static grid relative to world
        const GRID_SIZE = 50;
        this.ctx.strokeStyle = CONFIG.COLORS.grid;
        this.ctx.lineWidth = 1;

        // Calculate offset based on camera
        // We want grid lines to move with the world
        let startX = Math.floor(this.cameraX / GRID_SIZE) * GRID_SIZE;

        // Vertical lines
        for (let x = startX; x < startX + this.width + GRID_SIZE; x += GRID_SIZE) {
             let drawX = x - this.cameraX;
             this.ctx.beginPath();
             this.ctx.moveTo(drawX, 0);
             this.ctx.lineTo(drawX, this.height);
             this.ctx.stroke();
        }
        // Horizontal lines (camera-aware)
        let startY = Math.floor(this.cameraY / GRID_SIZE) * GRID_SIZE;
        for (let y = startY; y < startY + this.height + GRID_SIZE; y += GRID_SIZE) {
             let drawY = y - this.cameraY;
             this.ctx.beginPath();
             this.ctx.moveTo(0, drawY);
             this.ctx.lineTo(this.width, drawY);
             this.ctx.stroke();
        }


        // Draw Stars (Subtle in background)
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        this.stars.forEach(s => {
            // Parallax x relative to camera
            let x = s.x - this.cameraX * 0.5;
            // Wrap star x
            x = ((x % CONFIG.WORLD_WIDTH) + CONFIG.WORLD_WIDTH) % CONFIG.WORLD_WIDTH;

            this.ctx.fillRect(x, s.y, s.size, s.size);
        });

        // Draw Terrain Line
        this.ctx.strokeStyle = '#333';
        this.ctx.lineWidth = 2;
        this.ctx.shadowBlur = 0;
        this.ctx.beginPath();
        // Simple line at bottom
        let groundY = this.height - 20;
        this.ctx.moveTo(0, groundY);
        this.ctx.lineTo(this.width, groundY);
        this.ctx.stroke();

        // Draw Entities
        this.entities.forEach(e => {
            // Draw relative to camera
            let rx = e.x - this.cameraX;
            // Wrap rx to be near screen
            let drawnX = rx;
            while (drawnX < -100) drawnX += CONFIG.WORLD_WIDTH;
            while (drawnX > this.width + 100) drawnX -= CONFIG.WORLD_WIDTH;

            this.ctx.save();
            this.ctx.translate(drawnX, e.y);
            e.draw(this.ctx);
            this.ctx.restore();
        });

        // Draw Particles
        this.particles.forEach(p => {
            let rx = p.x - this.cameraX;
            while (rx < -100) rx += CONFIG.WORLD_WIDTH;
            while (rx > this.width + 100) rx -= CONFIG.WORLD_WIDTH;

            this.ctx.save();
            this.ctx.translate(rx, p.y);
            p.draw(this.ctx);
            this.ctx.restore();
        });

        this.ctx.restore();

        // Draw Minimap
        this.drawMinimap();
    },

    drawMinimap: function() {
        const mmW = this.minimapCanvas.width;
        const mmH = this.minimapCanvas.height;
        const scaleX = mmW / CONFIG.WORLD_WIDTH;
        const scaleY = mmH / this.height;

        this.minimapCtx.clearRect(0, 0, mmW, mmH);
        this.minimapCtx.fillStyle = '#000';
        this.minimapCtx.fillRect(0, 0, mmW, mmH);

        // Draw Frame (current view)
        // CameraX corresponds to left edge
        let camX = ((this.cameraX % CONFIG.WORLD_WIDTH) + CONFIG.WORLD_WIDTH) % CONFIG.WORLD_WIDTH;
        let camW = this.width;

        this.minimapCtx.strokeStyle = '#555';
        this.minimapCtx.strokeRect(camX * scaleX, 0, camW * scaleX, mmH);
        // Handle wrap for frame
        if (camX + camW > CONFIG.WORLD_WIDTH) {
             this.minimapCtx.strokeRect((camX - CONFIG.WORLD_WIDTH) * scaleX, 0, camW * scaleX, mmH);
        }

        this.entities.forEach(e => {
            let mx = e.x * scaleX;
            let my = e.y * scaleY;

            if (e.type === 'player') this.minimapCtx.fillStyle = CONFIG.COLORS.minimap_player;
            else if (e.type === 'enemy') this.minimapCtx.fillStyle = CONFIG.COLORS.minimap_enemy;
            else return;

            this.minimapCtx.fillRect(mx, my, 2, 2);
        });
    },

    updateHUD: function() {
        document.getElementById('score-display').innerText = `SCORE: ${this.score}`;
        let statusText = `LIVES: ${this.lives} | BOMBS: ${this.smartBombs}`;

        if (this.player && this.player.shieldActive) statusText += " | SHIELD";
        if (this.player && this.player.rapidActive) statusText += " | RAPID";
        if (this.player && this.player.speedActive) statusText += " | SPEED";

        document.getElementById('lives-display').innerText = statusText;
    },

    spawnExplosion: function(x, y, color) {
        AudioSys.explode();
        for(let i=0; i<10; i++) {
            this.particles.push(new Particle(x, y, color));
        }
    },

    triggerSmartBomb: function() {
        if (this.smartBombs <= 0) return;
        if (!this.player || this.player.dead) return;

        this.smartBombs--;
        this.updateHUD();
        AudioSys.playTone(100, 'sawtooth', 1.0, 0.5); // Deep boom

        // Flash screen
        const flash = document.createElement('div');
        flash.style.position = 'absolute';
        flash.style.top = '0';
        flash.style.left = '0';
        flash.style.width = '100%';
        flash.style.height = '100%';
        flash.style.background = '#fff';
        flash.style.zIndex = '100';
        flash.style.opacity = '1';
        flash.style.transition = 'opacity 0.5s ease-out';
        document.body.appendChild(flash);
        setTimeout(() => {
            flash.style.opacity = '0';
            setTimeout(() => flash.remove(), 500);
        }, 50);

        // Kill all enemies on screen
        const enemies = this.entities.filter(e => e.type === 'enemy');
        let count = 0;
        enemies.forEach(e => {
            // Check if on screen (similar logic to Lander.fire)
            let rx = e.x - this.cameraX;
            while (rx < -100) rx += CONFIG.WORLD_WIDTH;
            while (rx > this.width + 100) rx -= CONFIG.WORLD_WIDTH;

            if (rx > -50 && rx < this.width + 50) {
                 e.takeDamage();
                 count++;
            }
        });
    }
};

// --- ENTITIES ---

class Entity {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.w = 0;
        this.h = 0;
        this.dead = false;
        this.type = 'entity';
    }

    update(dt) {
        this.x += this.vx; // * dt handled by pre-scaling v or simple per-frame logic?
        // Let's assume vx is pixels per frame for simplicity or stick to dt.
        // If vx is pixels/sec, multiply by dt.
        // The CONFIG speeds are small (0.5), implying per-frame acceleration?
        // Let's use per-frame physics for that classic feel, or normalize.
        // Let's assume 60fps: dt ~ 0.016.
        // If speed is 10 pixels/frame -> 600 pixels/sec.

        // Let's adhere to dt for smooth 60fps+.
        // Adjust config values.

        this.y += this.vy;

        // Wrap World
        if (this.x < 0) this.x += CONFIG.WORLD_WIDTH;
        if (this.x > CONFIG.WORLD_WIDTH) this.x -= CONFIG.WORLD_WIDTH;
    }

    draw(ctx) {}
}

class Player extends Entity {
    constructor(x, y) {
        super(x, y);
        this.type = 'player';
        this.w = 30;
        this.h = 15;
        this.facingRight = true;
        this.lastFireTime = 0;
        this.invulnerable = false;

        // Powerups
        this.shieldActive = false;
        this.rapidActive = false;
        this.speedActive = false;

        this.rapidTimer = 0;
        this.speedTimer = 0;
    }

    update(dt) {
        // Update Powerup Timers
        if (this.rapidActive) {
            this.rapidTimer -= dt;
            if (this.rapidTimer <= 0) {
                this.rapidActive = false;
                this.rapidTimer = 0;
            }
        }
        if (this.speedActive) {
            this.speedTimer -= dt;
            if (this.speedTimer <= 0) {
                this.speedActive = false;
                this.speedTimer = 0;
            }
        }
        Game.updateHUD(); // Refresh HUD for timers

        // Input Handling
        let ACCEL_X = CONFIG.PLAYER_ACCEL_X * dt;
        let ACCEL_Y = CONFIG.PLAYER_ACCEL_Y * dt;
        let MAX_SPEED_X = CONFIG.PLAYER_MAX_SPEED_X;

        if (this.speedActive) {
            ACCEL_X *= 2;
            MAX_SPEED_X *= 1.5;
        }

        const FRICTION = Math.pow(CONFIG.PLAYER_FRICTION, dt * 60);

        let inputX = 0;
        let inputY = 0;

        if (Input.keys['ArrowUp'] || Input.touch.dy < -0.2) inputY = -1;
        if (Input.keys['ArrowDown'] || Input.touch.dy > 0.2) inputY = 1;
        if (Input.keys['ArrowLeft'] || Input.touch.dx < -0.2) inputX = -1;
        if (Input.keys['ArrowRight'] || Input.touch.dx > 0.2) inputX = 1;

        if (inputX !== 0) {
            this.vx += inputX * ACCEL_X;
            this.facingRight = inputX > 0;
        }
        if (inputY !== 0) {
            this.vy += inputY * ACCEL_Y;
        }

        // Friction
        this.vx *= FRICTION;
        this.vy *= FRICTION;

        // Clamp Speed
        if (Math.abs(this.vx) > MAX_SPEED_X) {
            this.vx = Math.sign(this.vx) * MAX_SPEED_X;
        }
        if (Math.abs(this.vy) > CONFIG.PLAYER_MAX_SPEED_Y) {
            this.vy = Math.sign(this.vy) * CONFIG.PLAYER_MAX_SPEED_Y;
        }

        // Bounds Y
        if (this.y < 50) this.y = 50;
        if (this.y > Game.height - 50) this.y = Game.height - 50;

        super.update(dt);
    }

    draw(ctx) {
        if (this.invulnerable && Math.floor(Date.now() / 100) % 2 === 0) return; // Blink

        if (this.shieldActive) {
            ctx.save();
            ctx.strokeStyle = CONFIG.COLORS.shield;
            ctx.shadowColor = CONFIG.COLORS.shield;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, 0, 25, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        ctx.strokeStyle = CONFIG.COLORS.player;
        ctx.lineWidth = 2;
        // Stronger white glow
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 20;

        ctx.beginPath();
        if (this.facingRight) {
            ctx.moveTo(-15, -7);
            ctx.lineTo(15, 0);
            ctx.lineTo(-15, 7);
            ctx.lineTo(-10, 0);
            ctx.closePath();
        } else {
            ctx.moveTo(15, -7);
            ctx.lineTo(-15, 0);
            ctx.lineTo(15, 7);
            ctx.lineTo(10, 0);
            ctx.closePath();
        }
        ctx.stroke();

        // Engine flame (simple line, less "fire")
        ctx.beginPath();
        ctx.strokeStyle = '#ccc';
        if (this.facingRight && Math.random() > 0.5) {
            ctx.moveTo(-15, 0);
            ctx.lineTo(-25, 0);
        } else if (!this.facingRight && Math.random() > 0.5) {
            ctx.moveTo(15, 0);
            ctx.lineTo(25, 0);
        }
        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    canFire() {
        const now = performance.now();
        const rate = this.rapidActive ? 50 : 200; // 50ms vs 200ms
        if (now - this.lastFireTime > rate) {
            return true;
        }
        return false;
    }

    fire() {
        this.lastFireTime = performance.now();
        AudioSys.shoot();

        const dir = this.facingRight ? 1 : -1;
        // Bullet spawns in front
        const bx = this.x + (dir * 20);
        // Bullet velocity adds player velocity? Or constant?
        // Usually constant high speed + player velocity fraction.
        const bvx = (dir * CONFIG.LASER_SPEED) + (this.vx * 0.5);

        Game.entities.push(new Bullet(bx, this.y, bvx, 'player'));
    }

    die() {
        Game.spawnExplosion(this.x, this.y, CONFIG.COLORS.player);
        Game.lives--;

        // Reset powerups on death
        this.shieldActive = false;
        this.rapidActive = false;
        this.speedActive = false;

        Game.updateHUD();
        if (Game.lives <= 0) {
            Game.gameOver();
        } else {
            // Respawn center screen relative to camera
            this.x = Game.cameraX + Game.width / 2;
            this.y = Game.height / 2;
            this.vx = 0;
            this.vy = 0;
            this.invulnerable = true;
            setTimeout(() => { this.invulnerable = false; }, 2000);
        }
    }

    activatePowerup(kind) {
        if (kind === POWERUPS.SHIELD) {
            this.shieldActive = true;
        } else if (kind === POWERUPS.RAPID) {
            this.rapidActive = true;
            this.rapidTimer = 10.0; // 10 seconds
        } else if (kind === POWERUPS.SPEED) {
            this.speedActive = true;
            this.speedTimer = 10.0; // 10 seconds
        }
        Game.updateHUD();
    }

    deactivateShield() {
        this.shieldActive = false;
        this.invulnerable = true;
        if (this.invulTimeoutId !== null) {
            clearTimeout(this.invulTimeoutId);
            this.invulTimeoutId = null;
        }
        this.invulTimeoutId = setTimeout(() => {
            this.invulnerable = false;
            this.invulTimeoutId = null;
        }, 1000); // Brief iframe after shield loss
        AudioSys.playTone(200, 'sawtooth', 0.5); // Shield break sound
        Game.updateHUD();
    }

    hyperspace() {
        if (this.dead) return;

        // Visual vanish effect at old pos
        Game.spawnExplosion(this.x, this.y, '#00ffff');
        AudioSys.playTone(800, 'triangle', 0.5, 0.3);

        // Randomize Position
        this.x = Math.random() * CONFIG.WORLD_WIDTH;
        this.y = Math.random() * (Game.height - 100) + 50;
        this.vx = 0;
        this.vy = 0;

        // Risk of death (10%)
        if (Math.random() < 0.10) {
            setTimeout(() => {
                console.log("Hyperspace Malfunction");
                this.die();
            }, 200);
        } else {
             // Visual appear effect
             Game.spawnExplosion(this.x, this.y, '#ffffff');
        }
    }
}

class Lander extends Entity {
    constructor(x, y) {
        super(x, y);
        this.type = 'enemy';
        this.w = 20;
        this.h = 20;
        this.timer = Math.random() * 100;
        this.vx = (Math.random() - 0.5) * 2; // Drift
        this.fireTimer = Math.random() * 3 + 2; // Random start delay
    }

    update(dt) {
        this.timer += dt * 10;
        // Bobbing motion
        this.vy = Math.sin(this.timer) * 1;

        // Shooting logic
        this.fireTimer -= dt;
        if (this.fireTimer <= 0) {
            this.fireTimer = Math.random() * 4 + 2; // Fire every 2-6 seconds
            this.fire();
        }

        super.update(dt);
    }

    fire() {
        // Only fire if on screen
        if (!Game.player || Game.player.dead) return;

        // Simple on-screen check (approximate, ignores wrap edge cases for simplicity)
        // Check relative to camera
        let rx = this.x - Game.cameraX;
        while (rx < -100) rx += CONFIG.WORLD_WIDTH;
        while (rx > Game.width + 100) rx -= CONFIG.WORLD_WIDTH;

        if (rx > 0 && rx < Game.width) {
            // Calculate vector to player
            // Need to account for player position relative to this enemy (handling wrap)
            let tx = Game.player.x;
            let ty = Game.player.y;

            // Adjust tx for wrap if closer wrapped
            if (tx - this.x > CONFIG.WORLD_WIDTH / 2) tx -= CONFIG.WORLD_WIDTH;
            if (tx - this.x < -CONFIG.WORLD_WIDTH / 2) tx += CONFIG.WORLD_WIDTH;

            const dx = tx - this.x;
            const dy = ty - this.y;
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist > 0) {
                const speed = 6; // Enemy bullet speed (slower than player laser)
                const vx = (dx / dist) * speed;
                const vy = (dy / dist) * speed;

                // Spawn bullet
                const b = new Bullet(this.x, this.y, vx, 'enemy');
                b.vy = vy; // Bullet class default only uses vx, need to allow vy
                Game.entities.push(b);
            }
        }
    }

    draw(ctx) {
        ctx.strokeStyle = CONFIG.COLORS.enemy;
        ctx.lineWidth = 2;
        // Stronger grey glow
        ctx.shadowColor = CONFIG.COLORS.enemy;
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.moveTo(-10, -10);
        ctx.lineTo(10, -10);
        ctx.lineTo(10, 5);
        ctx.lineTo(0, 10);
        ctx.lineTo(-10, 5);
        ctx.closePath();

        // Inner detail
        ctx.moveTo(-5, -5);
        ctx.lineTo(5, -5);
        ctx.lineTo(0, 5);
        ctx.closePath();

        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    takeDamage() {
        this.dead = true;
        Game.score += 100;
        Game.updateHUD();
        Game.spawnExplosion(this.x, this.y, CONFIG.COLORS.enemy);

        if (Math.random() < CONFIG.POWERUP_CHANCE) {
            const types = [POWERUPS.SHIELD, POWERUPS.RAPID, POWERUPS.SPEED];
            const kind = types[Math.floor(Math.random() * types.length)];
            Game.entities.push(new PowerUp(this.x, this.y, kind));
        }
    }
}

class PowerUp extends Entity {
    constructor(x, y, kind) {
        super(x, y);
        this.type = 'powerup';
        this.kind = kind;
        this.w = 15;
        this.h = 15;
        this.vx = (Math.random() - 0.5) * 1;
        this.vy = (Math.random() - 0.5) * 1;
        this.life = 10.0; // Disappear after 10s if not picked
    }

    update(dt) {
        this.life -= dt;
        if (this.life <= 0) this.dead = true;

        super.update(dt);
        // Clamp Y position so power-up stays on screen
        if (this.y < 0) this.y = 0;
        if (this.y > Game.H) this.y = Game.H;
    }

    draw(ctx) {
        let color = '#fff';
        let text = '?';
        if (this.kind === POWERUPS.SHIELD) { color = CONFIG.COLORS.shield; text = 'S'; }
        if (this.kind === POWERUPS.RAPID) { color = CONFIG.COLORS.rapid; text = 'R'; }
        if (this.kind === POWERUPS.SPEED) { color = CONFIG.COLORS.speed; text = 'F'; } // F for Fast

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;

        ctx.strokeRect(-7, -7, 14, 14);

        ctx.fillStyle = color;
        ctx.font = '10px Inter';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 0, 1);

        ctx.shadowBlur = 0;
    }
}

class Bullet extends Entity {
    constructor(x, y, vx, owner) {
        super(x, y);
        this.type = 'bullet';
        this.vx = vx;
        this.vy = 0;
        this.w = 20;
        this.h = 5;
        this.owner = owner; // 'player' or 'enemy'
        this.life = 2.0; // Seconds
    }

    update(dt) {
        this.life -= dt;
        if (this.life <= 0) this.dead = true;

        this.x += this.vx * (dt * 60);
        this.y += this.vy * (dt * 60); // Allow Y movement

        if (this.x < 0) this.x += CONFIG.WORLD_WIDTH;
        if (this.x > CONFIG.WORLD_WIDTH) this.x -= CONFIG.WORLD_WIDTH;
    }

    draw(ctx) {
        if (this.owner === 'player') {
            ctx.fillStyle = CONFIG.COLORS.laser;
            ctx.shadowColor = CONFIG.COLORS.laser;
            ctx.shadowBlur = 15;
            ctx.fillRect(-10, -2, 20, 4);
        } else {
            // Enemy bullet style
            ctx.fillStyle = '#ff5555';
            ctx.shadowColor = '#ff5555';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.shadowBlur = 0;
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.05 + 0.02;
    }

    update(dt) {
        this.x += this.vx * (dt * 60);
        this.y += this.vy * (dt * 60);
        this.life -= this.decay;
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillRect(-2, -2, 4, 4);
        ctx.globalAlpha = 1.0;
    }
}

// Start
Game.init();
